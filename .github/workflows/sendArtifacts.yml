name: Playwright send artifacts

on:
  workflow_run:
    workflows:
      - Playwright
    types:
      - completed

permissions:
  actions: read

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Playwright report
        if: always()
        run: |
          if [ -d playwright-report ]; then
            zip -qr playwright-report.zip playwright-report
          else
            echo "Playwright report artifact not found; skipping email attachment."
          fi

      - name: Send email via Resend
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$REPORT_EMAIL_TO" ] && [ -f playwright-report.zip ]; then
            curl -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{
                \"from\": \"onboarding@resend.dev\",
                \"to\": [\"$REPORT_EMAIL_TO\"],
                \"subject\": \"Playwright Report\",
                \"html\": \"<p>Tests completed successfully</p>\"
              }"
          else
            echo "Resend email skipped because required secrets or report archive are missing."
          fi

