name: Playwright send artifacts

on:
  workflow_run:
    workflows:
      - Playwright
    types:
      - completed

permissions:
  actions: read

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Playwright report
        if: always()
        run: |
          if [ -d playwright-report ]; then
            zip -qr playwright-report.zip playwright-report
          else
            echo "Playwright report artifact not found; skipping email attachment."
          fi

      - name: Check email configuration
        id: email-config
        if: always()
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
        run: |
          if [ -n "$SMTP_SERVER" ] && [ -n "$SMTP_PORT" ] && [ -n "$SMTP_USERNAME" ] && [ -n "$SMTP_PASSWORD" ] && [ -n "$REPORT_EMAIL_TO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Email report skipped because one or more SMTP secrets are missing."
          fi

      - name: Email Playwright report
        if: always() && steps.email-config.outputs.enabled == 'true' && hashFiles('playwright-report.zip') != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Playwright report: ${{ job.status }}"
          to: ${{ secrets.REPORT_EMAIL_TO }}
          from: ${{ secrets.SMTP_USERNAME }}
          body: |
            Playwright test run completed with status: ${{ job.status }}
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            The complete HTML report is attached as a ZIP archive.
          attachments: playwright-report.zip
