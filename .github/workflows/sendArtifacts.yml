name: Playwright send artifacts

on:
  workflow_run:
    workflows:
      - Playwright
    types:
      - completed

permissions:
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Playwright report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: playwright-report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Playwright report
        id: report
        run: |
          if [ -f playwright-report/index.html ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Playwright report artifact not found; skipping Pages deployment."
          fi

      - name: Upload report to GitHub Pages
        if: steps.report.outputs.exists == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report

      - name: Deploy report to GitHub Pages
        if: steps.report.outputs.exists == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send report link via Resend
        if: steps.deployment.outcome == 'success'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          if [ -n "$RESEND_API_KEY" ] && [ -n "$REPORT_EMAIL_TO" ]; then
            REPORT_URL="$REPORT_URL" REPORT_EMAIL_TO="$REPORT_EMAIL_TO" python -c 'import json, os; from pathlib import Path; url = os.environ["REPORT_URL"]; payload = {"from": "onboarding@resend.dev", "to": [os.environ["REPORT_EMAIL_TO"]], "subject": "Playwright Report", "html": f"<p>Playwright tests completed. <a href=\"{url}\">View the report</a>.</p>"}; Path("/tmp/resend_payload.json").write_text(json.dumps(payload))'

            curl -fsS -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data @/tmp/resend_payload.json
          else
            echo "Resend email skipped because required secrets are missing."
          fi
